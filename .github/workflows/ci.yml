name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: Build learning samples
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Check tracked public configuration
        shell: pwsh
        run: ./scripts/Test-PublicConfiguration.ps1
      - name: Restore solution
        run: dotnet restore AzureFundamentals.sln
      - name: Restore isolated Functions metadata project
        run: dotnet restore AzureTangyFunc/AzureTangyFunc.csproj
      - name: Build solution
        run: dotnet build AzureFundamentals.sln --configuration Release --no-restore

      - name: Test image processing without Azure resources
        run: dotnet test tests/Image.Tests/Image.Tests.csproj --configuration Release
      - name: Restore isolated preview
        run: dotnet restore tools/Preview/Preview.csproj
      - name: Build isolated preview
        run: dotnet build tools/Preview/Preview.csproj --configuration Release --no-restore
